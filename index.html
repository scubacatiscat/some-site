<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>고양이 잡기</title>
<style>
  :root { --bg:#fff7ec; --fg:#3b2a1a; --card:#ffe3b8; --btn:#ff8a3d; --btn-fg:#fff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#1d1712; --fg:#f5e6d3; --card:#33281d; --btn:#ff8a3d; --btn-fg:#1d1712; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; margin:0; }
  body { background:var(--bg); color:var(--fg); font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;
    display:flex; flex-direction:column; align-items:center; padding:16px; user-select:none; }
  h1 { margin:4px 0 8px; font-size:1.6rem; }
  .bar { display:flex; gap:12px; margin-bottom:10px; font-weight:700; }
  .bar div { background:var(--card); padding:6px 14px; border-radius:999px; }
  #field { position:relative; width:100%; max-width:560px; flex:1; max-height:520px; min-height:300px;
    background:var(--card); border-radius:20px; overflow:hidden; touch-action:manipulation; }
  #cat { position:absolute; width:80px; height:80px; cursor:pointer; display:none;
    transition:left .12s, top .12s; }
  #cat img { width:100%; height:100%; object-fit:cover; border-radius:50%; pointer-events:none; }
  #cat .emoji { font-size:3.2rem; line-height:80px; text-align:center; display:block; }
  #cat.hit { transform:scale(1.4) rotate(20deg); opacity:.4; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:12px; text-align:center; background:color-mix(in srgb, var(--card) 88%, transparent); }
  #overlay p { margin:0; font-size:1.1rem; }
  button { background:var(--btn); color:var(--btn-fg); border:0; border-radius:12px; padding:12px 28px;
    font-size:1.1rem; font-weight:700; cursor:pointer; }
  button:active { transform:scale(.96); }
</style>
</head>
<body>
  <h1>🐱 고양이 잡기</h1>
  <div class="bar">
    <div>점수 <span id="score">0</span></div>
    <div>시간 <span id="time">30</span></div>
    <div>최고 <span id="best">0</span></div>
  </div>
  <div id="field">
    <div id="cat"></div>
    <div id="overlay">
      <p id="msg">고양이를 눌러서 잡으세요!<br>30초 안에 몇 번 잡을 수 있을까요?</p>
      <button id="start">시작</button>
    </div>
  </div>

<script>
  // ★ 올린 사진 파일 이름으로 바꾸세요 (대소문자, 확장자 똑같이)
  const CAT_IMG = '16.jpg';

  const field = document.getElementById('field');
  const cat = document.getElementById('cat');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');

  // 고양이 사진 넣기 (실패하면 이모지)
  const img = new Image();
  img.src = CAT_IMG;
  img.alt = '고양이';
  img.onerror = () => { cat.innerHTML = '<span class="emoji">🐱</span>'; };
  cat.appendChild(img);

  let score = 0, time = 30, moveTimer = null, clockTimer = null, playing = false;
  let best = 0;
  try { best = parseInt(localStorage.getItem('catBest')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function moveCat() {
    if (!playing) return;
    cat.classList.remove('hit');
    const maxX = field.clientWidth - 80;
    const maxY = field.clientHeight - 80;
    cat.style.left = Math.random() * maxX + 'px';
    cat.style.top = Math.random() * maxY + 'px';
    cat.style.display = 'block';
    const delay = Math.max(350, 900 - score * 25);
    moveTimer = setTimeout(moveCat, delay);
  }

  function catchCat(e) {
    if (!playing) return;
    e.preventDefault();
    score++;
    scoreEl.textContent = score;
    cat.classList.add('hit');
    clearTimeout(moveTimer);
    setTimeout(moveCat, 120);
  }
  cat.addEventListener('pointerdown', catchCat);

  function startGame() {
    score = 0; time = 30; playing = true;
    scoreEl.textContent = 0; timeEl.textContent = 30;
    overlay.style.display = 'none';
    moveCat();
    clockTimer = setInterval(() => {
      time--;
      timeEl.textContent = time;
      if (time <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearInterval(clockTimer);
    clearTimeout(moveTimer);
    cat.style.display = 'none';
    let extra = '';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('catBest', best); } catch (e) {}
      extra = '<br> 최고기록 달성';
    }
    msg.innerHTML = '고양이를 <b>' + score + '</b>번 잡으셨네요.' + extra;
    document.getElementById('start').textContent = '다시 하기';
    overlay.style.display = 'flex';
  }

  document.getElementById('start').addEventListener('click', startGame);
</script>
</body>
</html>
