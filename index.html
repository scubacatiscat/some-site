<script>
  // 올린 사진 파일 이름 (대소문자, 확장자 똑같이)
  const CAT_IMG = '16.jpg';
  const ANGRY_IMG = '22.gif';
  const QUEST_IMG = '퀘스트롤픽셀.jpg';

  const GAME_TIME = 45;        // 제한 시간(초)
  const MIN_SIZE = 30, MAX_SIZE = 160;
  const SLOW = 2.5;            // 이동 간격 배수 (클수록 느려짐)
  const ESCAPE_CHANCE = 0.01;  // 박스 탈출 확률 1%
  const REFUSE_CHANCE = 0.02;  // 점수 거절 확률 2%
  const REFUSE_TIME = 4000;    // 점수 거절 지속 시간 (4초)
  const ANGRY_COLOR = true;   // true로 바꾸면 화난 사진만 컬러로 표시
  
  const FAKE_START_SCORE = 10; // 몇 점부터 분신술이 등장할지
  const FAKE_LINES = [
    '가짜였습니다~ ㅋ',
    '거긴 내가 아닙니다.',
    '속았군요, 집사여!',
    '눈이 어두우시네요.'
  ];

  const REFUSE_LINES = [
    '귀찮습니다. 점수는 없습니다.',
    '짜증납니다. 거절합니다.',
    '싫습니다. 건드리지 마십시오.',
    '오늘은 영업하지 않습니다.'
  ];

  const field = document.getElementById('field');
  const cat = document.getElementById('cat');
  const face = document.getElementById('face');
  const bubble = document.getElementById('bubble');
  const overlay = document.getElementById('overlay');
  const msg = document.getElementById('msg');
  const scoreEl = document.getElementById('score');
  const timeEl = document.getElementById('time');
  const bestEl = document.getElementById('best');
  const quest = document.getElementById('quest');
  const questIcon = document.getElementById('questIcon');
  const questText = document.getElementById('questText');
  const escCountEl = document.getElementById('escCount');
  const refCountEl = document.getElementById('refCount');
  const codeBox = document.getElementById('code');
  const codeInput = document.getElementById('codeInput');

  // 퀘스트 텍스트에 분신 속은 횟수 항목 동적 추가
  questText.innerHTML = `
    고양이가 화면 밖에 나간 횟수: <span id="escCount">0</span>번 (확률 1%)<br>
    고양이가 점수를 거절한 횟수: <span id="refCount">0</span>번 (확률 2%)<br>
    가짜 고양이에 속은 횟수: <span id="fakeCount">0</span>번
  `;
  const fakeCountEl = document.getElementById('fakeCount');

  // 고양이 사진 넣기 (실패하면 이모지)
  const img = new Image();
  img.src = CAT_IMG;
  img.alt = '고양이';
  img.draggable = false;
  img.onerror = () => { face.innerHTML = '<span class="emoji">🐱</span>'; };
  face.appendChild(img);

  // 화난 고양이 사진 미리 불러오기
  let angryOk = true;
  const angryImg = new Image();
  angryImg.src = ANGRY_IMG;
  angryImg.onerror = () => { angryOk = false; };

  function showAngryFace(on) {
    if (!angryOk || !face.contains(img)) return;
    img.src = on ? ANGRY_IMG : CAT_IMG;
    cat.classList.toggle('color', on && ANGRY_COLOR);
  }

  // 퀘스트 두루마리 사진 넣기
  const qimg = new Image();
  qimg.src = QUEST_IMG;
  qimg.alt = '퀘스트';
  qimg.draggable = false;
  qimg.onerror = () => { questIcon.innerHTML = '<span class="emoji">📜</span>'; };
  questIcon.appendChild(qimg);

  questIcon.addEventListener('click', () => {
    questText.style.display = (questText.style.display === 'block') ? 'none' : 'block';
  });

  let score = 0, time = GAME_TIME, moveTimer = null, clockTimer = null, playing = false;
  let escaped = false, escCount = 0, refCount = 0, fakeCount = 0, refusing = false;
  let unlimited = false;
  let best = 0;
  let fakeCats = []; // 가짜 고양이 요소들을 담을 배열

  try { best = parseInt(localStorage.getItem('catBest')) || 0; } catch (e) {}
  bestEl.textContent = best;

  function showTime() {
    timeEl.textContent = unlimited ? '∞' : time;
  }

  codeInput.addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    const v = codeInput.value.trim().toLowerCase();
    codeInput.value = '';
    if (v === 'inf') {
      unlimited = !unlimited;
      if (!unlimited) time = GAME_TIME;
      showTime();
      codeInput.placeholder = unlimited ? '무제한 적용됨' : '무제한 해제됨';
    } else if (v) {
      codeInput.placeholder = '알 수 없는 코드';
    }
    codeInput.blur();
  });

  function randSize() {
    return MIN_SIZE + Math.random() * (MAX_SIZE - MIN_SIZE);
  }

  function reshapeCat() {
    cat.style.width = randSize() + 'px';
    cat.style.height = randSize() + 'px';
  }

  function placeInside(el) {
    const maxX = Math.max(0, field.clientWidth - el.offsetWidth);
    const maxY = Math.max(0, field.clientHeight - el.offsetHeight);
    el.style.left = Math.random() * maxX + 'px';
    el.style.top = Math.random() * maxY + 'px';
  }

  function hits(x, y, w, h, r) {
    return x < r.right && x + w > r.left && y < r.bottom && y + h > r.top;
  }

  function placeOutside(el) {
    const r = field.getBoundingClientRect();
    const q = quest.getBoundingClientRect();
    const c = codeBox.getBoundingClientRect();
    const vw = document.documentElement.clientWidth;
    const vh = window.innerHeight;
    const w = el.offsetWidth, h = el.offsetHeight;
    for (let i = 0; i < 80; i++) {
      const x = Math.random() * Math.max(0, vw - w);
      const y = Math.random() * Math.max(0, vh - h);
      if (!hits(x, y, w, h, r) && !hits(x, y, w, h, q) && !hits(x, y, w, h, c)) {
        el.style.left = (x - r.left) + 'px';
        el.style.top = (y - r.top) + 'px';
        return;
      }
    }
    el.style.left = (vw - w - r.left) + 'px';
    el.style.top = (-r.top) + 'px';
  }

  // --- 분신(가짜 고양이) 관리 함수 ---
  function createFakeCatElement() {
    const fCat = document.createElement('div');
    fCat.className = 'fake-cat';
    fCat.style.position = 'absolute';
    fCat.style.width = '80px';
    fCat.style.height = '80px';
    fCat.style.cursor = 'pointer';
    fCat.style.zIndex = '4';
    fCat.style.transition = 'left .12s, top .12s, opacity .12s';
    
    const fFace = document.createElement('div');
    fFace.style.width = '100%';
    fFace.style.height = '100%';
    const fImg = new Image();
    fImg.src = CAT_IMG;
    fImg.alt = '가짜고양이';
    fImg.draggable = false;
    fImg.onerror = () => { fFace.innerHTML = '<span class="emoji" style="font-size:3.2rem;line-height:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%;">🐱</span>'; };
    fFace.appendChild(fImg);

    const fBubble = document.createElement('div');
    fBubble.style.position = 'absolute';
    fBubble.style.bottom = '100%';
    fBubble.style.left = '50%';
    fBubble.style.transform = 'translateX(-50%)';
    fBubble.style.marginBottom = '6px';
    fBubble.style.display = 'none';
    fBubble.style.whiteSpace = 'nowrap';
    fBubble.style.background = 'var(--bg)';
    fBubble.style.color = 'var(--fg)';
    fBubble.style.border = '2px solid var(--fg)';
    fBubble.style.padding = '4px 10px';
    fBubble.style.fontSize = '.85rem';
    fBubble.style.fontWeight = '700';
    fBubble.style.pointerEvents = 'none';

    fCat.appendChild(fFace);
    fCat.appendChild(fBubble);

    let fakeRefusing = false;

    fCat.addEventListener('pointerdown', (e) => {
      if (!playing || fakeRefusing) return;
      e.preventDefault();
      fakeRefusing = true;
      fakeCount++;
      fakeCountEl.textContent = fakeCount;

      fBubble.textContent = FAKE_LINES[Math.floor(Math.random() * FAKE_LINES.length)];
      fBubble.style.display = 'block';
      fCat.style.opacity = '.3';

      setTimeout(() => {
        fBubble.style.display = 'none';
        fCat.style.opacity = '1';
        fakeRefusing = false;
      }, 1500);
    });

    field.appendChild(fCat);
    return fCat;
  }

  function updateFakeCats() {
    // 기존 가짜 고양이 제거
    fakeCats.forEach(fc => fc.remove());
    fakeCats = [];

    // 점수가 10점 이상이고 35% 확률로 분신 1~2마리 소환
    if (score >= FAKE_START_SCORE && Math.random() < 0.35) {
      const count = score >= 25 ? 2 : 1; // 점수 높으면 2마리까지!
      for (let i = 0; i < count; i++) {
        const fc = createFakeCatElement();
        fc.style.width = randSize() + 'px';
        fc.style.height = randSize() + 'px';
        if (escaped) {
          placeOutside(fc);
        } else {
          placeInside(fc);
        }
        fc.style.display = 'block';
        fakeCats.push(fc);
      }
    }
  }
  // ---------------------------------

  function moveCat() {
    if (!playing) return;
    refusing = false;
    cat.classList.remove('hit', 'angry');
    showAngryFace(false);

    if (!escaped && Math.random() < ESCAPE_CHANCE) {
      escaped = true;
      escCount++;
      escCountEl.textContent = escCount;
    }

    if (escaped) placeOutside(cat); else placeInside(cat);
    cat.style.display = 'block';

    // 진짜 고양이가 이동할 때 분신들도 같이 갱신/이동
    updateFakeCats();

    const delay = Math.max(350, 900 - score * 25) * SLOW;
    moveTimer = setTimeout(moveCat, delay);
  }

  function catchCat(e) {
    if (!playing) return;
    e.preventDefault();
    if (refusing) return; 
    clearTimeout(moveTimer);

    if (Math.random() < REFUSE_CHANCE) {
      refusing = true;
      refCount++;
      refCountEl.textContent = refCount;
      bubble.textContent = REFUSE_LINES[Math.floor(Math.random() * REFUSE_LINES.length)];
      cat.classList.add('angry');
      showAngryFace(true);
      moveTimer = setTimeout(moveCat, REFUSE_TIME);
      return;
    }

    score++;
    scoreEl.textContent = score;
    escaped = false; 
    cat.classList.add('hit');
    reshapeCat();
    moveTimer = setTimeout(moveCat, 120);
  }
  cat.addEventListener('pointerdown', catchCat);

  function startGame() {
    score = 0; time = GAME_TIME; playing = true;
    escaped = false; escCount = 0; refCount = 0; fakeCount = 0; refusing = false;
    scoreEl.textContent = 0; showTime();
    escCountEl.textContent = 0; refCountEl.textContent = 0; fakeCountEl.textContent = 0;
    
    // 게임 시작 시 기존 분신들 청소
    fakeCats.forEach(fc => fc.remove());
    fakeCats = [];

    cat.style.width = '80px';
    cat.style.height = '80px';
    cat.classList.remove('angry', 'hit');
    showAngryFace(false);
    overlay.style.display = 'none';
    moveCat();
    clearInterval(clockTimer);
    clockTimer = setInterval(() => {
      if (unlimited) return;
      time--;
      showTime();
      if (time <= 0) endGame();
    }, 1000);
  }

  function endGame() {
    playing = false;
    clearInterval(clockTimer);
    clearTimeout(moveTimer);
    cat.style.display = 'none';
    
    // 게임 끝나면 분신들도 숨기기
    fakeCats.forEach(fc => fc.style.display = 'none');

    let extra = '';
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem('catBest', best); } catch (e) {}
      extra = '<br>최고 기록을 경신하셨네요.';
    }
    msg.innerHTML = '시간이 종료되었습니다.<br>고양이를 <b>' + score + '</b>번 잡으셨네요.' + extra;
    document.getElementById('start').textContent = '다시 시작';
    overlay.style.display = 'flex';
  }

  document.getElementById('start').addEventListener('click', startGame);
</script>
