<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>catch cat Ranking</title>
<style>
  :root { --bg:#f2f2f2; --fg:#111; --card:#d9d9d9; --btn:#111; --btn-fg:#fff; --gold:#a97c00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#111; --fg:#eee; --card:#2a2a2a; --btn:#eee; --btn-fg:#111; --gold:#ffd54f; }
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; border-radius:0 !important; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg);
    font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif; }
  header { text-align:center; }
  h1 { margin:4px 0 8px; font-size:1.6rem; letter-spacing:.05em; }
  h1 .sm { font-size:1.1rem; font-weight:400; letter-spacing:0; }
  .bar { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:10px; font-weight:700; }
  .bar div { background:var(--card); padding:6px 14px; }
  .tools { display:flex; gap:8px; justify-content:center; margin-bottom:18px; }
  .btn, button { background:var(--btn); color:var(--btn-fg); border:0; padding:10px 20px; font-size:1rem;
    font-weight:700; cursor:pointer; text-decoration:none; display:inline-block; touch-action:manipulation; }
  .btn.sub, button.sub { background:transparent; color:var(--fg); border:2px solid var(--fg); padding:8px 18px; }
  button.rep { padding:2px 8px; font-size:.75rem; border-width:1px; }
  button:disabled { opacity:.4; cursor:default; }
  button:active { transform:scale(.96); }

  .grid { display:grid; grid-template-columns:1fr 240px 1fr; gap:20px; max-width:1100px; margin:0 auto; align-items:start; }
  .ptitle { background:var(--card); text-align:center; font-weight:700; font-size:1.3rem; padding:18px 10px; margin-bottom:12px; }
  .plist { background:var(--card); padding:6px 10px; min-height:60px; }
  .plist table { width:100%; border-collapse:collapse; }
  .plist td { padding:6px 4px; border-bottom:1px solid var(--fg); }
  .plist td.r { width:46px; }
  .plist td.v { text-align:right; white-space:nowrap; }
  .plist td.b { width:52px; text-align:right; }
  .plist td.goldname { color:var(--gold); font-weight:900; text-shadow:0 0 6px rgba(255,200,0,.55); }
  .plist .note { text-align:center; padding:10px; font-size:.85rem; }

  /* 우승자 액자 (누르면 치워짐) */
  #champWrap { text-align:center; }
  #champ { text-align:center; cursor:pointer; transition:transform .35s, opacity .35s; }
  #champ.off { transform:translateY(40px) rotate(8deg); opacity:0; }
  #champ img.frame { width:100%; max-width:220px; height:auto; display:block; margin:0 auto; }
  .gold { padding:14px; background:linear-gradient(135deg,#f5d77a,#b8860b 45%,#f5d77a 70%,#8a6508);
    box-shadow:0 4px 12px rgba(0,0,0,.35); }
  .gold .inner { background:#fff; padding:12px 8px; color:#111; min-height:150px;
    display:flex; align-items:center; justify-content:center; }
  .gold .inner img { width:100%; height:auto; display:block; }
  .gold .inner .big { font-size:4rem; }
  .cap { margin-top:8px; font-weight:700; font-size:.9rem; line-height:1.5; }

  /* 인터넷 익스플로전 */
  #ieBtn { display:none; background:transparent; color:var(--fg); border:0; padding:0; cursor:pointer; margin:0 auto; }
  .ieIcon { position:relative; width:120px; height:120px; margin:0 auto 6px; border-radius:50% !important;
    background:radial-gradient(circle at 35% 30%, #5fb4ff, #0a55b8); display:flex; align-items:center;
    justify-content:center; box-shadow:0 4px 12px rgba(0,0,0,.35); }
  .ieIcon .e { font-size:4.4rem; font-weight:900; color:#fff; font-family:Georgia,serif; line-height:1; }
  .ieIcon .boom { position:absolute; right:-8px; top:-10px; font-size:2.4rem; }
  .ieLabel { font-weight:800; font-size:.95rem; }
  .ieBlink { animation:ieb .9s ease-in-out infinite alternate; }
  @keyframes ieb { from { transform:scale(1); } to { transform:scale(1.06); } }

  #ieWin { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:100; display:none; align-items:center;
    justify-content:center; padding:12px; }
  #ieWin.open { display:flex; }
  .ieBox { width:min(640px,100%); max-height:90vh; display:flex; flex-direction:column; background:#fff; color:#202124;
    border:3px solid #0a55b8; box-shadow:0 8px 30px rgba(0,0,0,.5); }
  .ieTitle { background:linear-gradient(#2a7cf0,#0a55b8); color:#fff; padding:6px 10px; display:flex;
    justify-content:space-between; align-items:center; font-weight:700; font-size:.9rem; }
  .ieTitle button { background:#d32f2f; color:#fff; border:0; padding:2px 10px; font-size:.9rem; }
  .ieBody { padding:14px; overflow:auto; }
  .ieHead { font-size:1.6rem; font-weight:900; font-family:Georgia,serif; margin-bottom:10px; }
  .ieBar { display:flex; align-items:center; gap:10px; border:1px solid #dfe1e5; box-shadow:0 1px 6px rgba(32,33,36,.18);
    border-radius:24px !important; padding:6px 16px; margin-bottom:14px; position:relative; }
  .ieBar button { background:transparent; color:#202124; border:0; padding:0 6px; font-size:1.7rem; line-height:1; font-weight:400; }
  .ieBar .tk { margin-left:auto; font-size:.95rem; }
  .gainTk { position:absolute; left:18px; top:-6px; color:#0a55b8; font-weight:900; animation:gt .7s ease-out forwards; pointer-events:none; }
  @keyframes gt { from { transform:translateY(0); opacity:1; } to { transform:translateY(-30px); opacity:0; } }
  .codeRow { border-bottom:1px solid #e0e0e0; padding:8px 2px; }
  .codeRow b { display:inline-block; background:#fff3b0; padding:0 6px; margin-right:6px; font-family:monospace; }
  .codeRow .ex { color:#b00020; font-weight:700; margin-left:6px; }
  .codeRow .d { color:#4d5156; font-size:.9rem; margin-top:2px; }

  @media (max-width: 760px) {
    .grid { grid-template-columns:1fr; }
    #champWrap { order:-1; max-width:240px; margin:0 auto; }
  }
</style>
<script>
  window.onerror = function (m, src, line) {
    var d = document.createElement('div');
    d.style.cssText = 'position:fixed;left:8px;right:8px;top:8px;z-index:9999;padding:10px;background:#b00020;color:#fff;font:14px sans-serif';
    d.textContent = '오류: ' + m + ' (줄 ' + line + ')';
    document.body.appendChild(d);
  };
</script>
</head>
<body>
  <header>
    <h1>catch cat <span class="sm">Ranking</span></h1>
    <div class="bar">
      <div>score <span id="lastScore">0</span></div>
      <div>best <span id="bestScore">0</span></div>
      <div>pop <span id="popTotal">0</span></div>
    </div>
    <div class="tools">
      <a class="btn" href="index.html">게임으로</a>
      <button class="sub" id="refresh">새로고침</button>
    </div>
  </header>

  <div class="grid">
    <section>
      <div class="ptitle">catch cat top 15</div>
      <div class="plist" id="listScore"></div>
    </section>

    <div id="champWrap">
      <div id="champ"></div>
      <button id="ieBtn" class="ieBlink">
        <div class="ieIcon"><span class="e">e</span><span class="boom">💥</span></div>
        <div class="ieLabel">Internet Explosion</div>
      </button>
    </div>

    <section>
      <div class="ptitle">pop cat top 15</div>
      <div class="plist" id="listPop"></div>
    </section>
  </div>

  <!-- 캣피디아 (인터넷 익스플로전) -->
  <div id="ieWin">
    <div class="ieBox">
      <div class="ieTitle"><span>Internet Explosion — 캣피디아</span><button id="ieClose">✕</button></div>
      <div class="ieBody">
        <div class="ieHead">캣피디아</div>
        <div class="ieBar">
          <button id="iePlus" title="인터넷 토큰 받기">+</button>
          <span>+ 버튼을 누르면 인터넷 토큰을 얻습니다</span>
          <span class="tk">토큰 <b id="ieTokens">0</b></span>
        </div>
        <div id="ieList"></div>
      </div>
    </div>
  </div>

<script>
  // 랭킹 서버 (index.html의 DB, RANK_ROOT, POP_BOARD와 항상 같게 유지할 것)
  const DB = 'https://catch-cat-a1fd1-default-rtdb.asia-southeast1.firebasedatabase.app';
  const RANK_ROOT = 'ranks/s2';
  const POP_BOARD = 'pop2';  // pop 랭킹 구역 (초기화된 새 구역)
  const REPORT_LIMIT = 3;   // 이 인원 이상이 신고하면 숨김
  const RANK_MAX = 15;      // 표시 인원

  // 1대 우승자 액자: 아래 목록을 앞에서부터 찾음 (둘 다 없으면 금색 액자로 대신 표시)
  const FRAME_IMGS = ['frame.png', '스크린샷_2026-11-16_164819.png'];
  const CHAMP_IMG = 'champion.png';       // 기본 액자 안에 넣을 그림 (없으면 🏆)
  const CHAMP_TITLE = '1대 catch cat 우승자';
  const CHAMP_NAME = '';                  // 기본 액자를 쓸 때 우승자 닉네임을 여기에 적으십시오

  // 캣피디아에 나오는 코드 설명 [저장 이름(코드 관리와 같음), 입력하는 코드, 설명]
  const CODE_INFO = [
    ['dog', 'dog', '강아지가 고양이를 따라다니며 3대 때리고 사라집니다. 게임 시작 전에도 입력할 수 있습니다.'],
    ['moai', '모아이', '모아이가 등장하여 고양이를 15초에 한 번씩 때립니다.'],
    ['botcat', 'bot cat', '고양이가 4초 동안 연산한 뒤, 원래 속도의 5배로 4초간 빨라집니다.'],
    ['x', 'x', '고양이가 사라집니다.'],
    ['noover', 'no_over', '게임 시간이 3초 늘어납니다. (영구)'],
    ['superpop', 'super pop', '사용 시 pop을 1.5배로 10초간 유지합니다. (pop을 얻을 때 적용)']
  ];

  let cid = '';
  try { cid = localStorage.getItem('catCid') || ''; } catch (e) {}
  let reported = {};
  try { reported = JSON.parse(localStorage.getItem('catReportedV2')) || {}; } catch (e) {}

  function num(k) { try { return parseInt(localStorage.getItem(k)) || 0; } catch (e) { return 0; } }
  document.getElementById('lastScore').textContent = num('catLast').toLocaleString();
  document.getElementById('bestScore').textContent = num('catBest').toLocaleString();
  document.getElementById('popTotal').textContent = num('catPopTotal').toLocaleString();

  async function dbGet(board) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 5000);
    try {
      const r = await fetch(DB + '/' + RANK_ROOT + '/' + board + '.json', { signal: ctrl.signal });
      if (!r.ok) throw new Error('get ' + r.status);
      return (await r.json()) || {};
    } finally {
      clearTimeout(timer);
    }
  }
  function toList(obj, field) {
    return Object.keys(obj)
      .map(k => Object.assign({ key: k }, obj[k]))
      .filter(e => e && typeof e.name === 'string' && typeof e[field] === 'number');
  }
  function repCount(e) { return e.reports ? Object.keys(e.reports).length : 0; }
  function visibleSorted(list, field) {
    return list.filter(e => repCount(e) < REPORT_LIMIT)
      .sort((a, b) => b[field] - a[field] || (a.t || 0) - (b.t || 0));
  }
  async function reportEntry(board, key) {
    const r = await fetch(DB + '/' + RANK_ROOT + '/' + board + '/' + key + '/reports/' + cid + '.json',
      { method: 'PUT', body: 'true' });
    if (!r.ok) throw new Error('report');
  }

  function note(el, text) {
    el.innerHTML = '';
    const d = document.createElement('div');
    d.className = 'note';
    d.textContent = text;
    el.appendChild(d);
  }

  async function renderBoard(board, field, unit, el) {
    note(el, '불러오는 중...');
    let all;
    try { all = toList(await dbGet(board), field); }
    catch (e) { note(el, '랭킹 서버에 연결하지 못했습니다.'); return; }
    const vis = visibleSorted(all, field);
    const hidden = all.length - vis.length;
    if (!vis.length) { note(el, '아직 기록이 없습니다.'); return; }

    el.innerHTML = '';
    const table = document.createElement('table');
    vis.slice(0, RANK_MAX).forEach((e, i) => {
      const tr = document.createElement('tr');
      const mine = cid && e.cid === cid;
      const cells = [(i + 1) + '위', e.name + (mine ? ' ◀' : ''), e[field].toLocaleString() + unit];
      const cls = ['r', 'n', 'v'];
      cells.forEach((t, ci) => {
        const td = document.createElement('td');
        td.className = cls[ci];
        td.textContent = t; // 닉네임은 글자 그대로 표시
        if (mine) td.style.fontWeight = '900';
        if (ci === 1 && e.gold) td.className += ' goldname'; // gold2s 코드를 쓴 닉네임은 황금색
        tr.appendChild(td);
      });
      const tdb = document.createElement('td');
      tdb.className = 'b';
      if (!mine) {
        const b = document.createElement('button');
        b.className = 'sub rep';
        const rkey = board + ':' + e.key;
        if (reported[rkey] || !cid) { b.textContent = cid ? '신고함' : '신고'; b.disabled = true; }
        else {
          b.textContent = '신고';
          b.addEventListener('click', async () => {
            if (!confirm('"' + e.name + '" 기록을 신고하시겠습니까?\n부적절한 닉네임에만 사용해 주십시오.')) return;
            b.disabled = true;
            try {
              await reportEntry(board, e.key);
              reported[rkey] = 1;
              try { localStorage.setItem('catReportedV2', JSON.stringify(reported)); } catch (x) {}
              renderBoard(board, field, unit, el);
            } catch (x) {
              b.disabled = false;
              alert('신고에 실패하였습니다. 잠시 후 다시 시도해 주십시오.');
            }
          });
        }
        tdb.appendChild(b);
      }
      tr.appendChild(tdb);
      table.appendChild(tr);
    });
    el.appendChild(table);
    if (hidden > 0) {
      const n = document.createElement('div');
      n.className = 'note';
      n.textContent = '신고 누적으로 숨겨진 기록: ' + hidden + '건';
      el.appendChild(n);
    }
  }

  // 우승자 액자: 액자 그림이 있으면 그대로, 없으면 금색 액자
  function buildChamp() {
    const champ = document.getElementById('champ');
    const fi = new Image();
    fi.className = 'frame';
    fi.alt = CHAMP_TITLE;
    let i = 0;
    fi.onload = () => { champ.innerHTML = ''; champ.appendChild(fi); };
    fi.onerror = () => {
      i++;
      if (i < FRAME_IMGS.length) { fi.src = FRAME_IMGS[i]; return; }
      champ.innerHTML = '<div class="gold"><div class="inner" id="cInner"></div></div><div class="cap" id="cCap"></div>';
      const inner = document.getElementById('cInner');
      const ci = new Image();
      ci.alt = '우승자';
      ci.onload = () => { inner.innerHTML = ''; inner.appendChild(ci); };
      ci.onerror = () => { inner.innerHTML = '<div class="big">🏆</div>'; };
      inner.innerHTML = '<div class="big">🏆</div>';
      ci.src = CHAMP_IMG;
      const cap = document.getElementById('cCap');
      const t = document.createElement('div'); t.textContent = CHAMP_TITLE; cap.appendChild(t);
      if (CHAMP_NAME) { const n = document.createElement('div'); n.textContent = CHAMP_NAME; cap.appendChild(n); }
    };
    fi.src = FRAME_IMGS[0];
  }

  // 액자를 누르면 치워지고, 그 뒤에서 인터넷 익스플로전이 나타남
  const champEl = document.getElementById('champ');
  const ieBtn = document.getElementById('ieBtn');
  champEl.addEventListener('click', () => {
    champEl.classList.add('off');
    setTimeout(() => { champEl.style.display = 'none'; ieBtn.style.display = 'block'; }, 380);
  });

  // 캣피디아 창
  const ieWin = document.getElementById('ieWin');
  const ieList = document.getElementById('ieList');
  const ieTokensEl = document.getElementById('ieTokens');
  let tokens = num('catToken');
  ieTokensEl.textContent = tokens.toLocaleString();

  async function loadExpiry() {
    try {
      const r = await fetch(DB + '/' + RANK_ROOT + '/codes.json');
      if (!r.ok) return {};
      return (await r.json()) || {};
    } catch (e) { return {}; }
  }
  async function openIe() {
    ieWin.classList.add('open');
    ieList.innerHTML = '';
    const codes = await loadExpiry();
    CODE_INFO.forEach(c => {
      const row = document.createElement('div');
      row.className = 'codeRow';
      const head = document.createElement('div');
      const b = document.createElement('b'); b.textContent = c[1];
      head.appendChild(b);
      const exp = codes[c[0]];
      if (exp && typeof exp.exp === 'number' && Date.now() > exp.exp) {
        const x = document.createElement('span'); x.className = 'ex'; x.textContent = '(만료됨)';
        head.appendChild(x);
      }
      const d = document.createElement('div'); d.className = 'd'; d.textContent = c[2];
      row.appendChild(head); row.appendChild(d);
      ieList.appendChild(row);
    });
  }
  ieBtn.addEventListener('click', openIe);
  document.getElementById('ieClose').addEventListener('click', () => { ieWin.classList.remove('open'); });

  // + 버튼: 인터넷 토큰 획득
  document.getElementById('iePlus').addEventListener('click', () => {
    tokens++;
    try { localStorage.setItem('catToken', String(tokens)); } catch (e) {}
    ieTokensEl.textContent = tokens.toLocaleString();
    const g = document.createElement('span');
    g.className = 'gainTk';
    g.textContent = '+1';
    document.querySelector('.ieBar').appendChild(g);
    setTimeout(() => { g.remove(); }, 700);
  });

  function loadAll() {
    renderBoard('score', 'score', '점', document.getElementById('listScore'));
    renderBoard(POP_BOARD, 'pop', ' pop', document.getElementById('listPop'));
  }
  document.getElementById('refresh').addEventListener('click', loadAll);

  buildChamp();
  loadAll();
</script>
</body>
</html>
